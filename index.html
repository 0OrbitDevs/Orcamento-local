<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamentos Local</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header>

    <main>

      <div class="buttons">

        <a class="btn" href="https://drive.google.com/drive/folders/1gRQSOIG7Rkxvti3DklFNzjTR8FhxQzdj?usp=drive_link" target="_blank" rel="noopener" id="btn-windows">
          <span class="btn-icon">⊞</span>

            <span class="btn-label">Versão Windows</span>
            <span class="btn-sub">Abre no Google Drive</span>
          </span>

        <a class="btn" href="https://drive.google.com/drive/folders/1ZdwQRkuTWuwqeoj8a6K441aAKIlNO_kb?usp=drive_link" target="_blank" rel="noopener" id="btn-android">
          <span class="btn-icon">☰</span>
          <span class="btn-text">
            <span class="btn-label">Versão Android</span>
            <span class="btn-sub">Abre no Google Drive</span>
          </span>
        </a>

      </div>

      <p class="note" id="download-note"></p>
    </main>

    <footer>
      <span>v1.0 &mdash; Orçamentos Local</span>
    </footer>

  </div>

  <script src="script.js"></script>
